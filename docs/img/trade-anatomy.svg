<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" role="img" aria-label="Annotated chart showing a long trade: entry zone, stop, three targets, a trailed stop and the result label">
  <rect width="1000" height="300" fill="#0d1117"/>
  <rect x="20" y="18" width="571" height="256" fill="none" stroke="#1c2430"/>

  <!-- entry zone box -->
  <rect x="188" y="180" width="64.6" height="20" fill="#2bb3a3" opacity="0.22" stroke="#2bb3a3"/>
  <text x="190" y="175" font-size="9.5" font-weight="700" fill="#2bb3a3" font-family="ui-monospace,monospace">LONG &#183; A &#183; 5/5</text>

  <line x1="234" y1="84" x2="585" y2="84" stroke="#5bd97a" stroke-width="1.3" stroke-dasharray="6 4"/><text x="581" y="79" font-size="9.5" fill="#5bd97a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">TP3 4.0R</text>
  <line x1="234" y1="116" x2="585" y2="116" stroke="#5bd97a" stroke-width="1.3" stroke-dasharray="2 3"/><text x="581" y="111" font-size="9.5" fill="#5bd97a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">TP2 2.5R &#10003;</text>
  <line x1="234" y1="148" x2="585" y2="148" stroke="#5bd97a" stroke-width="1.3" stroke-dasharray="2 3"/><text x="581" y="143" font-size="9.5" fill="#5bd97a" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">TP1 1.2R &#10003;</text>
  <line x1="234" y1="180" x2="585" y2="180" stroke="#2bb3a3" stroke-width="1.6" stroke-dasharray=""/><text x="581" y="175" font-size="9.5" fill="#2bb3a3" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Entry</text>
  <line x1="234" y1="206" x2="585" y2="206" stroke="#e8534d" stroke-width="1.6" stroke-dasharray=""/><text x="581" y="201" font-size="9.5" fill="#e8534d" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">SL (initial)</text>

  <!-- trailed stop steps -->
  <line x1="367" y1="206" x2="367" y2="180" stroke="#e8534d" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="367" y1="180" x2="443" y2="180" stroke="#e8534d" stroke-width="2"/>
  <line x1="443" y1="180" x2="443" y2="164" stroke="#e8534d" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="443" y1="164" x2="519" y2="164" stroke="#e8534d" stroke-width="2"/>
  <line x1="519" y1="164" x2="519" y2="132" stroke="#e8534d" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <line x1="519" y1="132" x2="585" y2="132" stroke="#e8534d" stroke-width="2"/>
  <text x="405" y="176" font-size="8.5" fill="#e8534d" text-anchor="middle" font-family="ui-monospace,monospace">breakeven</text>

  <line x1="44" y1="178" x2="44" y2="196" stroke="#ef5350" stroke-width="1.3"/><rect x="39.25" y="182" width="9.5" height="10" fill="#ef5350"/>
  <line x1="63" y1="186" x2="63" y2="204" stroke="#ef5350" stroke-width="1.3"/><rect x="58.25" y="192" width="9.5" height="6" fill="#ef5350"/>
  <line x1="82" y1="192" x2="82" y2="210" stroke="#ef5350" stroke-width="1.3"/><rect x="77.25" y="198" width="9.5" height="4" fill="#ef5350"/>
  <line x1="101" y1="188" x2="101" y2="206" stroke="#26a69a" stroke-width="1.3"/><rect x="96.25" y="196" width="9.5" height="6" fill="#26a69a"/>
  <line x1="120" y1="180" x2="120" y2="200" stroke="#26a69a" stroke-width="1.3"/><rect x="115.25" y="186" width="9.5" height="10" fill="#26a69a"/>
  <line x1="139" y1="176" x2="139" y2="196" stroke="#ef5350" stroke-width="1.3"/><rect x="134.25" y="186" width="9.5" height="4" fill="#ef5350"/>
  <line x1="158" y1="184" x2="158" y2="202" stroke="#ef5350" stroke-width="1.3"/><rect x="153.25" y="190" width="9.5" height="6" fill="#ef5350"/>
  <line x1="177" y1="190" x2="177" y2="206" stroke="#ef5350" stroke-width="1.3"/><rect x="172.25" y="196" width="9.5" height="4" fill="#ef5350"/>
  <line x1="196" y1="194" x2="196" y2="209" stroke="#26a69a" stroke-width="1.3"/><rect x="191.25" y="198" width="9.5" height="2" fill="#26a69a"/>
  <line x1="215" y1="188" x2="215" y2="204" stroke="#26a69a" stroke-width="1.3"/><rect x="210.25" y="190" width="9.5" height="8" fill="#26a69a"/>
  <line x1="234" y1="178" x2="234" y2="196" stroke="#26a69a" stroke-width="1.3"/><rect x="229.25" y="180" width="9.5" height="10" fill="#26a69a"/>
  <line x1="253" y1="168" x2="253" y2="186" stroke="#26a69a" stroke-width="1.3"/><rect x="248.25" y="172" width="9.5" height="8" fill="#26a69a"/>
  <line x1="272" y1="158" x2="272" y2="176" stroke="#26a69a" stroke-width="1.3"/><rect x="267.25" y="162" width="9.5" height="10" fill="#26a69a"/>
  <line x1="291" y1="150" x2="291" y2="168" stroke="#26a69a" stroke-width="1.3"/><rect x="286.25" y="154" width="9.5" height="8" fill="#26a69a"/>
  <line x1="310" y1="156" x2="310" y2="172" stroke="#ef5350" stroke-width="1.3"/><rect x="305.25" y="154" width="9.5" height="10" fill="#ef5350"/>
  <line x1="329" y1="162" x2="329" y2="178" stroke="#ef5350" stroke-width="1.3"/><rect x="324.25" y="164" width="9.5" height="6" fill="#ef5350"/>
  <line x1="348" y1="154" x2="348" y2="174" stroke="#26a69a" stroke-width="1.3"/><rect x="343.25" y="158" width="9.5" height="12" fill="#26a69a"/>
  <line x1="367" y1="144" x2="367" y2="162" stroke="#26a69a" stroke-width="1.3"/><rect x="362.25" y="148" width="9.5" height="10" fill="#26a69a"/>
  <line x1="386" y1="134" x2="386" y2="152" stroke="#26a69a" stroke-width="1.3"/><rect x="381.25" y="138" width="9.5" height="10" fill="#26a69a"/>
  <line x1="405" y1="126" x2="405" y2="144" stroke="#26a69a" stroke-width="1.3"/><rect x="400.25" y="130" width="9.5" height="8" fill="#26a69a"/>
  <line x1="424" y1="132" x2="424" y2="148" stroke="#ef5350" stroke-width="1.3"/><rect x="419.25" y="130" width="9.5" height="10" fill="#ef5350"/>
  <line x1="443" y1="138" x2="443" y2="154" stroke="#ef5350" stroke-width="1.3"/><rect x="438.25" y="140" width="9.5" height="6" fill="#ef5350"/>
  <line x1="462" y1="130" x2="462" y2="150" stroke="#26a69a" stroke-width="1.3"/><rect x="457.25" y="134" width="9.5" height="12" fill="#26a69a"/>
  <line x1="481" y1="120" x2="481" y2="138" stroke="#26a69a" stroke-width="1.3"/><rect x="476.25" y="124" width="9.5" height="10" fill="#26a69a"/>
  <line x1="500" y1="110" x2="500" y2="128" stroke="#26a69a" stroke-width="1.3"/><rect x="495.25" y="114" width="9.5" height="10" fill="#26a69a"/>
  <line x1="519" y1="104" x2="519" y2="120" stroke="#26a69a" stroke-width="1.3"/><rect x="514.25" y="108" width="9.5" height="6" fill="#26a69a"/>
  <line x1="538" y1="108" x2="538" y2="124" stroke="#ef5350" stroke-width="1.3"/><rect x="533.25" y="108" width="9.5" height="8" fill="#ef5350"/>
  <line x1="557" y1="112" x2="557" y2="130" stroke="#ef5350" stroke-width="1.3"/><rect x="552.25" y="116" width="9.5" height="6" fill="#ef5350"/>

  <!-- entry triangle -->
  <polygon points="234,200 228,210 240,210" fill="#5bd97a"/>

  <!-- result label -->
  <g transform="translate(542, 96)">
    <rect x="0" y="0" width="62" height="16" rx="3" fill="#1f7a44"/>
    <text x="31" y="11.5" font-size="9.5" font-weight="700" fill="#eafff2" text-anchor="middle" font-family="ui-monospace,monospace">+2.5R &#183; Target</text>
  </g>

  <circle cx="191" cy="190" r="9.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.4"/><text x="191" y="193.6" font-size="10.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">1</text>
  <circle cx="259" cy="220" r="9.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.4"/><text x="259" y="223.6" font-size="10.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">2</text>
  <circle cx="329" cy="134" r="9.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.4"/><text x="329" y="137.6" font-size="10.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">3</text>
  <circle cx="405" cy="196" r="9.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.4"/><text x="405" y="199.6" font-size="10.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">4</text>
  <circle cx="608" cy="104" r="9.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.4"/><text x="608" y="107.6" font-size="10.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">5</text>

  <circle cx="674" cy="48.5" r="8.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.3"/><text x="674" y="52" font-size="9.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">1</text><text x="691" y="48" font-size="11.5" font-weight="700" fill="#c9d4e0" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Entry zone + grade</text><text x="691" y="61" font-size="10.5" fill="#7d8b9c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">The FVG or order block price touched, and how the setup scored</text>
  <circle cx="674" cy="94.5" r="8.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.3"/><text x="674" y="98" font-size="9.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">2</text><text x="691" y="94" font-size="11.5" font-weight="700" fill="#c9d4e0" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Stop</text><text x="691" y="107" font-size="10.5" fill="#7d8b9c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Zone far edge minus an ATR buffer. 1R is measured from here</text>
  <circle cx="674" cy="140.5" r="8.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.3"/><text x="674" y="144" font-size="9.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">3</text><text x="691" y="140" font-size="11.5" font-weight="700" fill="#c9d4e0" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Targets</text><text x="691" y="153" font-size="10.5" fill="#7d8b9c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Nearest unbroken structure and EQH liquidity, each at least 1R</text>
  <circle cx="674" cy="186.5" r="8.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.3"/><text x="674" y="190" font-size="9.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">4</text><text x="691" y="186" font-size="11.5" font-weight="700" fill="#c9d4e0" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Trailing stop</text><text x="691" y="199" font-size="10.5" fill="#7d8b9c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">To breakeven at TP1, then behind each new swing. Never backwards</text>
  <circle cx="674" cy="232.5" r="8.5" fill="#0b0e11" stroke="#f0b90b" stroke-width="1.3"/><text x="674" y="236" font-size="9.5" font-weight="700" fill="#f0b90b" text-anchor="middle" font-family="ui-monospace,monospace">5</text><text x="691" y="232" font-size="11.5" font-weight="700" fill="#c9d4e0" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Result</text><text x="691" y="245" font-size="10.5" fill="#7d8b9c" font-family="system-ui,-apple-system,Segoe UI,sans-serif">One label per closed trade — the track record</text>
</svg>
